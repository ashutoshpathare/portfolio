<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ashutosh – IT Engineering Student exploring systems, networking, and creative tech."
    />
    <title>Ashutosh | Portfolio</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>

    <!-- ===== NAVBAR ===== -->
    <header class="navbar" id="navbar">
      <div class="navbar__inner">
        <!-- Logo / Name -->
        <a href="#hero" class="navbar__logo">Ashutosh</a>

        <!-- Desktop nav links -->
        <nav class="navbar__nav" id="navMenu" aria-label="Main navigation">
          <ul class="navbar__links">
            <li><a href="#about"   class="nav-link">About</a></li>
            <li><a href="#skills"  class="nav-link">Skills</a></li>
            <li><a href="#projects" class="nav-link">Projects</a></li>
            <li><a href="#gallery" class="nav-link">Gallery</a></li>
            <li><a href="#contact" class="nav-link">Contact</a></li>
          </ul>
        </nav>

        <!-- Hamburger button (mobile) -->
        <button
          class="navbar__hamburger"
          id="hamburger"
          aria-label="Toggle navigation menu"
          aria-expanded="false"
          aria-controls="navMenu"
        >
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
      </div>
    </header>

    <!-- ===== HERO ===== -->
    <section class="hero" id="hero">
      <div class="hero__inner">
        <!-- Label -->
        <p class="hero__label">IT Engineering Student</p>

        <!-- Main heading -->
        <h1 class="hero__heading">Ashutosh</h1>

        <!-- Tagline -->
        <p class="hero__tagline">
          I explore systems, networking and creative tech,<br class="br-desktop" />
          and I build things that connect both.
        </p>

        <!-- CTA buttons -->
        <div class="hero__cta">
          <a href="#projects" class="btn btn--primary">View Projects</a>
          <a href="#contact"  class="btn btn--outline">Get in Touch</a>
        </div>
      </div>
    </section>

    <!-- ===== PLACEHOLDER SECTIONS ===== -->

    <!-- About -->
    <section class="section" id="about">
      <div class="section__inner">
        <h2 class="section__title">About</h2>
      </div>
    </section>

    <!-- Skills -->
    <section class="section" id="skills">
      <div class="section__inner">
        <h2 class="section__title">Skills</h2>
      </div>
    </section>

    <!-- Projects -->
    <section class="section" id="projects">
      <div class="section__inner">
        <h2 class="section__title">Projects</h2>
      </div>
    </section>

    <!-- Gallery -->
    <section class="section" id="gallery">
      <div class="section__inner">
        <h2 class="section__title">Gallery</h2>
      </div>
    </section>

    <!-- Contact -->
    <section class="section" id="contact">
      <div class="section__inner">
        <h2 class="section__title">Contact</h2>
      </div>
    </section>

    <script src="js/main.js"></script>
  </body>
</html>
